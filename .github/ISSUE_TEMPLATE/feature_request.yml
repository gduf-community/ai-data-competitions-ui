name: 功能建议
description: 建议新增或优化公开 UI 页面、组件、交互或文档
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: background
    attributes:
      label: 需求背景
      description: 说明这个需求解决什么问题。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 目标页面或组件
      description: 例如首页、比赛列表、比赛卡片、筛选器、荣誉展示等。
    validations:
      required: true
  - type: textarea
    id: interaction
    attributes:
      label: 预期交互
      description: 描述你希望用户如何使用这个功能。
  - type: textarea
    id: mock-data
    attributes:
      label: Mock 数据字段
      description: 如果需要数据，请列出建议字段；不要填写真实业务数据。
  - type: textarea
    id: reference
    attributes:
      label: 参考截图或链接
      description: 请确认参考材料不包含内部信息或敏感数据。
