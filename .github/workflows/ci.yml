name: Web checks
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-checks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    name: Web quality and runtime artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WEB_RELEASE_MODE: public
      API_SERVICE_TOKEN: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: '10.34.5'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: git diff --exit-code -- package.json pnpm-lock.yaml
      - run: pnpm run ci
      - name: Package web standalone runtime with source and lock digests
        run: node scripts/package-runtime.mjs web
      - name: Upload immutable runtime and manifest
        id: runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-runtime-${{ github.sha }}
          path: |
            build/release/runtime.tar.gz
            build/release/runtime-manifest.json
          if-no-files-found: error
          retention-days: 14
