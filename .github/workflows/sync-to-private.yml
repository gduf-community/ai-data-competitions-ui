name: Sync merged PR metadata to private repository

on:
  pull_request_target:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sync-public-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync PR metadata
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    env:
      PRIVATE_REPO: GDUF-quantitative/competition-Q-A-website
      PRIVATE_BASE_BRANCH: main

      PUBLIC_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
      PR_MERGED_AT: ${{ github.event.pull_request.merged_at }}
      PR_MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      PR_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
      PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}

    steps:
      - name: Generate PR metadata file
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          RECORD_DIR="${RUNNER_TEMP}/public-pr-records"
          RECORD_FILE="${RECORD_DIR}/PR-${PR_NUMBER}.md"
          COMMITS_FILE="${RUNNER_TEMP}/commits-${PR_NUMBER}.md"

          mkdir -p "${RECORD_DIR}"

          gh api \
            --paginate \
            "repos/${PUBLIC_REPO}/pulls/${PR_NUMBER}/commits" \
            --jq '
              .[] |
              "- [`\(.sha[0:7])`](\(.html_url)) \(.commit.message | split("\n")[0]) — \(.author.login // .commit.author.name)"
            ' > "${COMMITS_FILE}"

          {
            echo "# 公开仓库 PR #${PR_NUMBER}"
            echo
            echo "## PR 信息"
            echo
            echo "- 仓库：\`${PUBLIC_REPO}\`"
            echo "- 标题：${PR_TITLE}"
            echo "- 作者：@${PR_AUTHOR}"
            echo "- 链接：${PR_URL}"
            echo "- 来源分支：\`${PR_HEAD_BRANCH}\`"
            echo "- 目标分支：\`${PR_BASE_BRANCH}\`"
            echo "- 合并者：@${PR_MERGED_BY}"
            echo "- 合并时间：${PR_MERGED_AT}"
            echo "- Merge commit：\`${PR_MERGE_COMMIT_SHA}\`"
            echo
            echo "## PR 描述"
            echo
            if [ -n "${PR_BODY}" ]; then
              printf '%s\n' "${PR_BODY}"
            else
              echo "无描述。"
            fi
            echo
            echo "## Commit 列表"
            echo
            if [ -s "${COMMITS_FILE}" ]; then
              cat "${COMMITS_FILE}"
            else
              echo "未获取到 commit 信息。"
            fi
          } > "${RECORD_FILE}"

      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ env.PRIVATE_BASE_BRANCH }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          fetch-depth: 0

      - name: Commit metadata record
        id: commit
        shell: bash
        working-directory: private
        run: |
          set -euo pipefail

          SYNC_BRANCH="sync/public-pr-${PR_NUMBER}"
          RECORD_DIR=".github/public-pr-records"
          RECORD_FILE="${RECORD_DIR}/PR-${PR_NUMBER}.md"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -C \
            "${SYNC_BRANCH}" \
            "origin/${PRIVATE_BASE_BRANCH}"

          mkdir -p "${RECORD_DIR}"

          cp \
            "${RUNNER_TEMP}/public-pr-records/PR-${PR_NUMBER}.md" \
            "${RECORD_FILE}"

          git add -- "${RECORD_FILE}"

          if git diff --cached --quiet; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "记录文件没有变化。"
            exit 0
          fi

          git commit \
            -m "docs(sync): 记录公开仓库 PR #${PR_NUMBER}" \
            -m "来源：${PR_URL}" \
            -m "Merge commit：${PR_MERGE_COMMIT_SHA}"

          git push \
            --force-with-lease \
            origin \
            "${SYNC_BRANCH}"

          echo "changed=true" >> "${GITHUB_OUTPUT}"
          echo "branch=${SYNC_BRANCH}" >> "${GITHUB_OUTPUT}"
          echo "record_file=${RECORD_FILE}" >> "${GITHUB_OUTPUT}"

      - name: Create or update private pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          SYNC_BRANCH: ${{ steps.commit.outputs.branch }}
          RECORD_FILE: ${{ steps.commit.outputs.record_file }}
        shell: bash
        working-directory: private
        run: |
          set -euo pipefail

          EXISTING_PR="$(
            gh pr list \
              --repo "${PRIVATE_REPO}" \
              --base "${PRIVATE_BASE_BRANCH}" \
              --head "${SYNC_BRANCH}" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [ -n "${EXISTING_PR}" ]; then
            gh pr edit "${EXISTING_PR}" \
              --repo "${PRIVATE_REPO}" \
              --title "meta: ${PR_TITLE}" \
              --body-file "${RECORD_FILE}"

            echo "已更新私有仓库 PR #${EXISTING_PR}。"
          else
            gh pr create \
              --repo "${PRIVATE_REPO}" \
              --base "${PRIVATE_BASE_BRANCH}" \
              --head "${SYNC_BRANCH}" \
              --title "meta: ${PR_TITLE}" \
              --body-file "${RECORD_FILE}"
          fi